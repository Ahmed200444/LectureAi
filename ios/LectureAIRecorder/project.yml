name: LectureAIRecorder
options:
  bundleIdPrefix: com.lectureai
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  LectureAIRecorder:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lectureai.recorder
        PRODUCT_NAME: LectureAIRecorder
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LectureAI Recorder
        NSMicrophoneUsageDescription: LectureAI uses the microphone only when you choose to record a lecture. Recordings stay on this device unless you explicitly share them.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
schemes:
  LectureAIRecorder:
    build:
      targets:
        LectureAIRecorder: all
    run:
      config: Debug
    archive:
      config: Release
