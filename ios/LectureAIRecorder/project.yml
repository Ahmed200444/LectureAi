name: LectureAIRecorder
options:
  bundleIdPrefix: com.lectureai
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.0
targets:
  LectureAIRecorder:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lectureai.recorder
        PRODUCT_NAME: LectureAIRecorder
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 2
        INFOPLIST_KEY_CFBundleDisplayName: LectureAI
        INFOPLIST_KEY_CFBundleName: LectureAI
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LectureAI
        NSMicrophoneUsageDescription: LectureAI uses the microphone only when you choose to record a lecture. Recordings stay on this device unless you explicitly share them.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
  LectureAIRecorderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LectureAIRecorder
schemes:
  LectureAIRecorder:
    build:
      targets:
        LectureAIRecorder: all
        LectureAIRecorderTests: [test]
    test:
      targets:
        - LectureAIRecorderTests
    run:
      config: Debug
    archive:
      config: Release
