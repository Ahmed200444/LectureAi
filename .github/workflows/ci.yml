name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript and tests
        run: npm run ci
      - name: Verify public web files
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f ROADMAP.md
      - name: Reject tracked private recordings and staging archives
        shell: bash
        run: |
          blocked="$(git ls-files | grep -Ei '\.(m4a|mp3|wav|webm|mp4|mov|aac|ogg|tar|tar\.gz|tgz|zip|b64)$' || true)"
          if [ -n "$blocked" ]; then
            echo "Blocked private-media or staging artifacts are tracked:"
            echo "$blocked"
            exit 1
          fi
