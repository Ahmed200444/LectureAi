name: Run final production audit patch

on:
  push:
    branches: [final-production-audit-20260829]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Apply final production audit fixes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-production-audit-20260829
      - name: Execute isolated patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/final-audit-fix.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n\n          git diff --check"
          if marker_start not in source or marker_end not in source:
              raise SystemExit('Temporary patch source markers were not found.')
          body = source.split(marker_start, 1)[1].split(marker_end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          exec(compile(script, 'final-audit-patch.py', 'exec'))
          PY

          git diff --check
          git status --short
          git config user.name "LectureAI Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hooks/use-recorder.ts lib/audio-validation.ts lib/device.ts lib/types.ts lib/transcript.ts lib/phone-transcriber.worker.ts lib/phone-transcription.ts lib/transcription.ts local-ai/engine.py src/App.tsx lib/db.ts components/LectureDetail.tsx components/RecordingFlow.tsx components/Diagnostics.tsx public/sw.js tests/run.ts tests/ios-safeguards.ts
          git commit -m "Apply final production audit fixes"
          git push origin HEAD:final-production-audit-20260829
