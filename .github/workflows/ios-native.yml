name: LectureAI Native iOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - native-ios-*
      - ios-cloud-ipa-*
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native.yml'

jobs:
  build-ios-recorder:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LectureAIRecorder
        run: xcodegen generate

      - name: Build iPhone Simulator app
        working-directory: ios/LectureAIRecorder
        run: |
          set -o pipefail
          xcodebuild \
            -project LectureAIRecorder.xcodeproj \
            -scheme LectureAIRecorder \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone device app
        working-directory: ios/LectureAIRecorder
        run: |
          set -euo pipefail
          rm -rf build-device Payload LectureAIRecorder-unsigned.ipa
          xcodebuild \
            -project LectureAIRecorder.xcodeproj \
            -scheme LectureAIRecorder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

          APP_PATH="$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -name 'LectureAIRecorder.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LectureAIRecorder-unsigned.ipa
          test -s LectureAIRecorder-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LectureAIRecorder-unsigned-ipa
          path: ios/LectureAIRecorder/LectureAIRecorder-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
