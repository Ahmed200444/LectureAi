name: LectureAI Native iOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - native-ios-*
      - ios-cloud-ipa-*
  pull_request:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, safeguards, and production build
        run: npm run check

  build-ios-recorder:
    needs: repo-check
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LectureAIRecorder
        run: xcodegen generate

      - name: Resolve pinned Swift packages
        working-directory: ios/LectureAIRecorder
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project LectureAIRecorder.xcodeproj \
            -scheme LectureAIRecorder

      - name: Build iPhone Simulator app
        working-directory: ios/LectureAIRecorder
        run: |
          set -o pipefail
          xcodebuild \
            -project LectureAIRecorder.xcodeproj \
            -scheme LectureAIRecorder \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee simulator-build.log

      - name: Extract simulator compiler errors
        if: always()
        working-directory: ios/LectureAIRecorder
        run: |
          if [ -f simulator-build.log ]; then
            grep -E '(^|[[:space:]])(error:|fatal error:)|:[0-9]+:[0-9]+: error:' simulator-build.log > simulator-compiler-errors.txt || true
          else
            echo 'simulator-build.log was not created' > simulator-compiler-errors.txt
          fi

      - name: Upload simulator build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LectureAI-simulator-build-diagnostics
          path: |
            ios/LectureAIRecorder/simulator-compiler-errors.txt
            ios/LectureAIRecorder/simulator-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run native unit tests
        working-directory: ios/LectureAIRecorder
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          test -n "$DEVICE_ID"
          xcodebuild \
            -project LectureAIRecorder.xcodeproj \
            -scheme LectureAIRecorder \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned iPhone/iPad device app
        working-directory: ios/LectureAIRecorder
        run: |
          set -euo pipefail
          rm -rf build-device Payload LectureAIRecorder-unsigned.ipa
          xcodebuild \
            -project LectureAIRecorder.xcodeproj \
            -scheme LectureAIRecorder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

          APP_PATH="$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -name 'LectureAIRecorder.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LectureAIRecorder-unsigned.ipa
          test -s LectureAIRecorder-unsigned.ipa

      - name: Verify packaged app metadata
        working-directory: ios/LectureAIRecorder
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          plist_path = Path('Payload/LectureAIRecorder.app/Info.plist')
          assert plist_path.exists(), f'Missing packaged Info.plist: {plist_path}'
          with plist_path.open('rb') as handle:
              info = plistlib.load(handle)

          assert info.get('CFBundleIdentifier') == 'com.lectureai.recorder', info.get('CFBundleIdentifier')
          assert info.get('CFBundleDisplayName') == 'LectureAI', info.get('CFBundleDisplayName')
          assert {1, 2}.issubset(set(info.get('UIDeviceFamily', []))), info.get('UIDeviceFamily')
          assert 'audio' in info.get('UIBackgroundModes', []), info.get('UIBackgroundModes')
          minimum = str(info.get('MinimumOSVersion', ''))
          assert minimum.startswith('17.'), minimum
          print('Packaged LectureAI metadata verified:', info.get('CFBundleIdentifier'), info.get('UIDeviceFamily'), info.get('UIBackgroundModes'), minimum)
          PY

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LectureAIRecorder-unsigned-ipa
          path: ios/LectureAIRecorder/LectureAIRecorder-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
