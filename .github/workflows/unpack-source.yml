name: Unpack LectureAI source

on:
  push:
    paths:
      - 'lectureai-source-repo.tar.gz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack source archive
        shell: bash
        run: |
          if [ ! -f lectureai-source-repo.tar.gz ]; then
            echo "Source archive is not present; nothing to unpack."
            exit 0
          fi
          tar -xzf lectureai-source-repo.tar.gz -C .
          rm lectureai-source-repo.tar.gz

      - name: Commit unpacked LectureAI source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add fixed LectureAI source"
          git push origin HEAD:main
