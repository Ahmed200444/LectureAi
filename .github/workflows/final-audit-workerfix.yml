name: Apply final audit phone confidence fix

on:
  push:
    branches: [final-production-audit-20260829]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Remove fallback fake phone confidence' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-production-audit-20260829
      - name: Remove remaining placeholder confidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/phone-transcriber.worker.ts')
          text = p.read_text(encoding='utf-8')
          old = "text: output.text.trim(), confidence: 0, speaker: 'Professor'"
          new = "text: output.text.trim(), speaker: 'Professor'"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one fallback placeholder; found {text.count(old)}')
          text = text.replace(old, new)
          if 'confidence: 0' in text:
              raise SystemExit('A placeholder confidence remains in the phone worker')
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "LectureAI Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/phone-transcriber.worker.ts
          git commit -m "Remove fallback fake phone confidence"
          git push origin HEAD:final-production-audit-20260829
