name: Apply final iOS audio memory audit fix

on:
  push:
    branches:
      - iphone-base-q4-20260831-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iphone-base-q4-20260831-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove duplicate decoded-audio copies
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/phone-transcription.ts')
          text = p.read_text()
          old = """function makeSpeechMonoBuffer(context: AudioContext, decoded: AudioBuffer) {
  const mono = context.createBuffer(1, decoded.length, decoded.sampleRate);
  const destination = mono.getChannelData(0);
  if (decoded.numberOfChannels === 1) {
    destination.set(decoded.getChannelData(0));
    return { buffer: mono, selectedChannel: 0, channelRms: [sampledRms(destination)] };
  }

  const channelRms = Array.from({ length: decoded.numberOfChannels }, (_, index) => sampledRms(decoded.getChannelData(index)));
"""
          new = """function makeSpeechMonoBuffer(context: AudioContext, decoded: AudioBuffer) {
  if (decoded.numberOfChannels === 1) {
    const source = decoded.getChannelData(0);
    return { buffer: decoded, selectedChannel: 0, channelRms: [sampledRms(source)] };
  }

  const mono = context.createBuffer(1, decoded.length, decoded.sampleRate);
  const destination = mono.getChannelData(0);
  const channelRms = Array.from({ length: decoded.numberOfChannels }, (_, index) => sampledRms(decoded.getChannelData(index)));
"""
          if old not in text:
              raise SystemExit('mono-copy pattern not found')
          text = text.replace(old, new, 1)
          text = text.replace("      pcm = new Float32Array(mono.buffer.getChannelData(0));\n", "      pcm = mono.buffer.getChannelData(0);\n", 1)
          text = text.replace("      pcm = new Float32Array(rendered.getChannelData(0));\n", "      pcm = rendered.getChannelData(0);\n", 1)
          p.write_text(text)

          for test_name in ['tests/ios-safeguards.ts', 'tests/multilingual-safeguards.ts']:
              t = Path(test_name)
              body = t.read_text()
              marker = "assert.match(phone, /makeSpeechMonoBuffer/);\n"
              addition = marker + "assert.match(phone, /return \\{ buffer: decoded, selectedChannel: 0/);\nassert.doesNotMatch(phone, /new Float32Array\\(rendered\\.getChannelData/);\n"
              if marker not in body:
                  raise SystemExit(f'test insertion point missing in {test_name}')
              t.write_text(body.replace(marker, addition, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Commit verified memory fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/phone-transcription.ts tests/ios-safeguards.ts tests/multilingual-safeguards.ts
          git commit -m "Reduce iPhone and iPad audio preparation memory"
          git push origin HEAD:iphone-base-q4-20260831-v2
