name: Source archive preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct source archive
        shell: bash
        run: |
          cat source-parts/part-* | base64 --decode > /tmp/lectureai-source.tar.gz
          tar -tzf /tmp/lectureai-source.tar.gz | tee /tmp/archive-files.txt
          mkdir -p /tmp/lectureai-source
          tar -xzf /tmp/lectureai-source.tar.gz -C /tmp/lectureai-source
          echo "Top-level extracted files:"
          find /tmp/lectureai-source -maxdepth 2 -type f | sort | head -80
      - name: Check for obvious secrets and private artifacts
        shell: bash
        run: |
          cd /tmp/lectureai-source
          if grep -RInE --exclude-dir=node_modules --exclude='*.lock' '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ANTHROPIC_API_KEY[[:space:]]*=|OPENAI_API_KEY[[:space:]]*=|PASSWORD[[:space:]]*=[^[:space:]]+|TOKEN[[:space:]]*=[^[:space:]]+)' .; then
            echo 'Potential secret-like content found; review before public release.'
            exit 1
          fi
          if find . -type f \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.webm' -o -iname '*.mp4' -o -iname '*.mov' \) -print | grep -q .; then
            echo 'Audio/video files found in source archive; review before public release.'
            find . -type f \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.webm' -o -iname '*.mp4' -o -iname '*.mov' \) -print
            exit 1
          fi
      - name: Install and validate application
        shell: bash
        run: |
          cd /tmp/lectureai-source
          test -f package.json
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run test
          npm run build
      - name: Verify expected production output
        shell: bash
        run: |
          cd /tmp/lectureai-source
          test -f dist/client/index.html
          test -f dist/client/manifest.webmanifest
          test -f dist/client/sw.js
          if [ -d local-ai ]; then python -m compileall -q local-ai; fi
          if [ -d benchmarks ]; then python -m compileall -q benchmarks; fi
