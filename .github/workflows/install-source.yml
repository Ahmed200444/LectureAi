name: LectureAI preflight

on:
  push:
    branches: [preflight-clean]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/lectureai-source.b64 /tmp/lectureai-source.tar.gz
          cat preflight-bundle/part-{000..008} >> /tmp/lectureai-source.b64
          cat preflight-fixes/part-009-0 preflight-fixes/part-009-1-0 preflight-fixes/part-009-1-1 >> /tmp/lectureai-source.b64
          cat preflight-bundle/part-010 preflight-bundle/part-011 >> /tmp/lectureai-source.b64
          cat preflight-fixes/part-012-0-0 preflight-fixes/part-012-0-1-0 preflight-fixes/part-012-0-1-1 preflight-fixes/part-012-1 >> /tmp/lectureai-source.b64
          cat preflight-fixes/part-013-0 preflight-fixes/part-013-1 >> /tmp/lectureai-source.b64
          cat preflight-fixes/part-014-0 preflight-fixes/part-014-1 >> /tmp/lectureai-source.b64
          cat preflight-bundle/part-015 >> /tmp/lectureai-source.b64
          cat preflight-fixes/part-016-0 preflight-fixes/part-016-1 >> /tmp/lectureai-source.b64
          cat preflight-bundle/part-017 >> /tmp/lectureai-source.b64
          cat preflight-fixes/part-018-0 preflight-fixes/part-018-1 >> /tmp/lectureai-source.b64
          cat preflight-bundle/part-019 preflight-bundle/part-020 >> /tmp/lectureai-source.b64
          base64 --decode /tmp/lectureai-source.b64 > /tmp/lectureai-source.tar.gz
          echo "3e155e900ecccce55272611bb63a8bfbb4182d2de283e5fcf18d6ec930c31a46  /tmp/lectureai-source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/lectureai-source.tar.gz >/dev/null
          mkdir clean-source
          tar -xzf /tmp/lectureai-source.tar.gz -C clean-source
          sed -i '/eslint-disable-next-line react-hooks\/exhaustive-deps/d' clean-source/components/MicTest.tsx
      - name: Install dependencies
        working-directory: clean-source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            rm -rf node_modules
            sleep 5
          done
      - name: Typecheck
        working-directory: clean-source
        run: npm run typecheck
      - name: Lint
        working-directory: clean-source
        run: npm run lint
      - name: Unit tests
        working-directory: clean-source
        run: npm run test
      - name: Production build
        working-directory: clean-source
        run: npm run build
      - name: Verify production output
        working-directory: clean-source
        run: test -f dist/client/index.html && test -f dist/client/manifest.webmanifest && test -f dist/client/sw.js
      - name: Check Windows helper Python syntax
        working-directory: clean-source
        run: python -m py_compile local-ai/*.py benchmarks/evaluate.py
      - name: Smoke test built site
        working-directory: clean-source
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory dist/client >/tmp/lectureai-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/tmp/lectureai-home.html; then break; fi
            sleep 0.5
          done
          grep -qi '<div id="root"></div>' /tmp/lectureai-home.html
          curl -fsS http://127.0.0.1:4173/manifest.webmanifest >/dev/null
          curl -fsS http://127.0.0.1:4173/sw.js >/dev/null
      - name: Normalize verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name clean-source -exec rm -rf {} +
          shopt -s dotglob
          cp -a clean-source/. .
          rm -rf clean-source
          git add -A
          git commit -m "Normalize verified LectureAI source"
          git push origin HEAD:preflight-clean
