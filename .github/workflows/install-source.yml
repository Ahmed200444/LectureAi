name: LectureAI CI

on:
  push:
    branches: [main, preflight-clean]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            rm -rf node_modules
            sleep 5
          done

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /tmp/lectureai-npm-audit.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('/tmp/lectureai-npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities ?? {};
          const knownNodeOnly = new Set([
            '@huggingface/transformers',
            'onnxruntime-node',
            'adm-zip',
            'sharp',
          ]);
          const names = Object.keys(vulnerabilities);
          const unexpected = names.filter((name) => !knownNodeOnly.has(name));
          const critical = names.filter((name) => vulnerabilities[name]?.severity === 'critical');

          if (critical.length) {
            console.error(`Critical production dependency advisories: ${critical.join(', ')}`);
            process.exit(1);
          }
          if (unexpected.length) {
            console.error(`Unexpected production dependency advisories: ${unexpected.join(', ')}`);
            process.exit(1);
          }

          if (names.length) {
            console.log(`Known upstream Node-only Transformers advisories present: ${names.join(', ')}`);
            console.log('Release continues only if the built browser bundle proves the Node-only modules are absent.');
          } else {
            console.log('No production dependency advisories reported by npm audit.');
          }
          NODE

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Verify production output
        run: test -f dist/client/index.html && test -f dist/client/manifest.webmanifest && test -f dist/client/sw.js

      - name: Verify Node-only vulnerable modules are not shipped to browsers
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -I -E 'onnxruntime-node|adm-zip|libvips' dist/client; then
            echo 'A Node-only vulnerable dependency leaked into the browser production bundle.' >&2
            exit 1
          fi
          echo 'Browser bundle excludes onnxruntime-node, adm-zip, and libvips.'

      - name: Check Windows helper Python syntax
        run: python -m py_compile local-ai/*.py benchmarks/evaluate.py

      - name: Smoke test built site
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory dist/client >/tmp/lectureai-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/tmp/lectureai-home.html; then break; fi
            sleep 0.5
          done
          grep -qi '<div id="root"></div>' /tmp/lectureai-home.html
          curl -fsS http://127.0.0.1:4173/manifest.webmanifest >/dev/null
          curl -fsS http://127.0.0.1:4173/sw.js >/dev/null
